name: Automate Organization Invites
on:
  issues:
    types: [labeled]

jobs:
  automate_invite:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'invite'
    steps:
      - name: Send Organization Invite
        uses: actions/github-script@v7
        with:
          github-token: \${{ secrets.INVITE_TOKEN }}
          script: |
            const issueOwner = context.payload.issue.user.login;
            
            // שליחת הזמנה לארגון
            await github.rest.orgs.createInvitation({
              org: 'https-mitmachim-top',
              invitee_id: context.payload.issue.user.id,
              role: 'direct_member'
            });
            
            // כתיבת תגובה וסגירת ה-Issue אוטומטית
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ברוך הבא לארגון מתמחים טופ @${issueOwner}! ההזמנה הרשמית נשלחה לחשבון שלך. יש לאשר אותה במייל או דרך עמוד הארגון בגיטהאב.`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
